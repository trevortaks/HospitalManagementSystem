services:
  postgres:
    image: postgres:16-alpine
    container_name: hospitalms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hospitalms}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hospitalms}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: HospitalMS.Web/HospitalMS.Web.csproj
        APP_DLL: HospitalMS.Web.dll
    container_name: hospitalms-web
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5001
      CONNECTION_STRING: ${CONNECTION_STRING}
      ConnectionStrings__postgres: ${CONNECTION_STRING}
      JwtSettings__Secret: ${JWT_SECRET}
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PROJECT: HospitalMS.API/HospitalMS.API.csproj
        APP_DLL: HospitalMS.API.dll
    container_name: hospitalms-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5002
      CONNECTION_STRING: ${CONNECTION_STRING}
      ConnectionStrings__postgres: ${CONNECTION_STRING}
      JwtSettings__Secret: ${JWT_SECRET}
      APP_DLL: HospitalMS.API.dll
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hospitalms-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hospitalms.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123!}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/misc/ping')\"",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
